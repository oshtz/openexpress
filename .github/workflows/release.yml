name: Release

# Triggered by a tag push (e.g. v0.1.0). Release artifacts are uploaded as a
# draft so the Windows portable updater and macOS app.zip updater can be smoked
# before publishing.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Windows portable
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v6

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Verify release version alignment
        run: npm run check:version

      - name: Build portable executable
        shell: pwsh
        run: npx tauri build --no-bundle

      - name: Stage portable executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "release-assets" -Force | Out-Null
          $exe = "src-tauri\target\release\openexpress.exe"
          if (-not (Test-Path -LiteralPath $exe)) {
            $exe = (Get-ChildItem -LiteralPath "src-tauri\target\release" -Filter "*.exe" | Select-Object -First 1).FullName
          }
          if (-not $exe -or -not (Test-Path -LiteralPath $exe)) {
            throw "Could not find built OpenExpress executable."
          }
          Copy-Item -LiteralPath $exe -Destination "release-assets\OpenExpress-Portable.exe" -Force

      - name: Require Windows signing secrets
        shell: pwsh
        env:
          WINDOWS_CODESIGN_CERTIFICATE: ${{ secrets.WINDOWS_CODESIGN_CERTIFICATE }}
          WINDOWS_CODESIGN_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PASSWORD }}
        run: |
          $missing = @()
          if (-not $env:WINDOWS_CODESIGN_CERTIFICATE) { $missing += "WINDOWS_CODESIGN_CERTIFICATE" }
          if (-not $env:WINDOWS_CODESIGN_PASSWORD) { $missing += "WINDOWS_CODESIGN_PASSWORD" }
          if ($missing.Count -gt 0) {
            throw "Missing required Windows signing secrets: $($missing -join ', ')"
          }

      - name: Sign and verify Windows executable
        shell: pwsh
        env:
          WINDOWS_CODESIGN_CERTIFICATE: ${{ secrets.WINDOWS_CODESIGN_CERTIFICATE }}
          WINDOWS_CODESIGN_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PASSWORD }}
        run: |
          $certPath = Join-Path $env:RUNNER_TEMP "openexpress-codesign.pfx"
          try {
            [IO.File]::WriteAllBytes(
              $certPath,
              [Convert]::FromBase64String($env:WINDOWS_CODESIGN_CERTIFICATE)
            )
            $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
              -Recurse -Filter "signtool.exe" |
              Where-Object { $_.FullName -match '\\x64\\' } |
              Sort-Object FullName -Descending |
              Select-Object -First 1
            if (-not $signTool) { throw "Could not find the x64 signtool.exe." }

            $asset = "release-assets\OpenExpress-Portable.exe"
            & $signTool.FullName sign /fd SHA256 /td SHA256 `
              /tr "http://timestamp.digicert.com" `
              /f $certPath /p $env:WINDOWS_CODESIGN_PASSWORD $asset
            if ($LASTEXITCODE -ne 0) { throw "signtool failed with exit code $LASTEXITCODE." }

            $signature = Get-AuthenticodeSignature -LiteralPath $asset
            if ($signature.Status -ne "Valid") {
              throw "Authenticode verification failed: $($signature.StatusMessage)"
            }
          }
          finally {
            Remove-Item -LiteralPath $certPath -Force -ErrorAction SilentlyContinue
          }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v6
        with:
          name: windows-portable
          path: release-assets/OpenExpress-Portable.exe
          if-no-files-found: error

  build-macos:
    name: macOS DMG and app.zip
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Verify release version alignment
        run: npm run check:version

      - name: Require macOS signing secrets
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "$APPLE_CERTIFICATE" ] || missing+=("APPLE_CERTIFICATE")
          [ -n "$APPLE_CERTIFICATE_PASSWORD" ] || missing+=("APPLE_CERTIFICATE_PASSWORD")
          [ -n "$APPLE_SIGNING_IDENTITY" ] || missing+=("APPLE_SIGNING_IDENTITY")
          [ -n "$APPLE_ID" ] || missing+=("APPLE_ID")
          [ -n "$APPLE_PASSWORD" ] || missing+=("APPLE_PASSWORD")
          [ -n "$APPLE_TEAM_ID" ] || missing+=("APPLE_TEAM_ID")
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required macOS signing secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/openexpress-signing.keychain-db"
          keychain_password="$(uuidgen)"
          cert_path="$RUNNER_TEMP/openexpress-developer-id.p12"

          CERT_PATH="$cert_path" python3 -c 'import base64, os, pathlib; pathlib.Path(os.environ["CERT_PATH"]).write_bytes(base64.b64decode(os.environ["APPLE_CERTIFICATE"]))'
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$cert_path" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security list-keychains -d user -s "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"

          echo "OPENEXPRESS_KEYCHAIN_PATH=$keychain" >> "$GITHUB_ENV"
          rm -f "$cert_path"

      - name: Build app bundle
        run: npx tauri build --bundles app

      - name: Sign, notarize, and staple app bundle
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          app="src-tauri/target/release/bundle/macos/OpenExpress.app"
          test -d "$app"

          codesign --force --deep --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$app"
          codesign --verify --deep --strict --verbose=2 "$app"

          notary_zip="$RUNNER_TEMP/OpenExpress-notary.zip"
          ditto -c -k --keepParent "$app" "$notary_zip"
          xcrun notarytool submit "$notary_zip" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$app"
          xcrun stapler validate "$app"
          spctl -a -vvv -t exec "$app"

      - name: Stage macOS artifacts
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          app="src-tauri/target/release/bundle/macos/OpenExpress.app"
          test -d "$app"

          ditto -c -k --keepParent "$app" "release-assets/OpenExpress.app.zip"

          dmg_root="$RUNNER_TEMP/openexpress-dmg"
          rm -rf "$dmg_root"
          mkdir -p "$dmg_root"
          ditto "$app" "$dmg_root/OpenExpress.app"
          ln -s /Applications "$dmg_root/Applications"
          hdiutil create \
            -volname "OpenExpress" \
            -srcfolder "$dmg_root" \
            -ov \
            -format UDZO \
            "release-assets/OpenExpress.dmg"
          codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" "release-assets/OpenExpress.dmg"
          codesign --verify --verbose=2 "release-assets/OpenExpress.dmg"

          case "$(uname -m)" in
            arm64) echo "darwin-aarch64" > release-assets/macos-platform.txt ;;
            x86_64) echo "darwin-x86_64" > release-assets/macos-platform.txt ;;
            *) echo "Unsupported macOS release architecture: $(uname -m)" >&2; exit 1 ;;
          esac

      - name: Cleanup signing keychain
        if: always()
        run: |
          if [ -n "${OPENEXPRESS_KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$OPENEXPRESS_KEYCHAIN_PATH" || true
          fi
          rm -f "$RUNNER_TEMP/OpenExpress-notary.zip" "$RUNNER_TEMP/openexpress-developer-id.p12"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v6
        with:
          name: macos-assets
          path: |
            release-assets/OpenExpress.app.zip
            release-assets/OpenExpress.dmg
            release-assets/macos-platform.txt
          if-no-files-found: error

  publish:
    name: Draft GitHub release
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Resolve release tag
        id: release
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${{ github.ref_name }}"
          else
            version=$(node -e "console.log(JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json', 'utf8')).version)")
            tag="v$version"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Verify release version alignment
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: npm run check:version

      - name: Download built artifacts
        uses: actions/download-artifact@v5
        with:
          path: release-assets
          merge-multiple: true

      - name: Resolve macOS updater platform
        id: macos
        run: echo "platform=$(cat release-assets/macos-platform.txt)" >> "$GITHUB_OUTPUT"

      - name: Generate updater manifest
        env:
          UPDATE_TAG: ${{ steps.release.outputs.tag }}
          UPDATE_VERSION: ${{ steps.release.outputs.version }}
          UPDATE_NOTES: "Security, output-integrity, and reliability improvements."
          MACOS_UPDATE_PLATFORM: ${{ steps.macos.outputs.platform }}
        run: node scripts/generate-update-manifest.mjs

      - name: Generate and verify checksums
        working-directory: release-assets
        run: |
          sha256sum \
            OpenExpress-Portable.exe \
            OpenExpress.app.zip \
            OpenExpress.dmg \
            latest.json > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt

      - name: Create or update draft release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: OpenExpress ${{ steps.release.outputs.tag }}
          body: |
            Security, output-integrity, and reliability improvements.

            Signed release assets:
            - Windows: OpenExpress-Portable.exe
            - macOS updater: OpenExpress.app.zip
            - macOS manual install: OpenExpress.dmg

            Verify downloads with SHA256SUMS.txt.
          draft: true
          prerelease: false
          files: |
            release-assets/OpenExpress-Portable.exe
            release-assets/OpenExpress.app.zip
            release-assets/OpenExpress.dmg
            release-assets/latest.json
            release-assets/SHA256SUMS.txt
